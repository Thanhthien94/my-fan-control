name: macOS CI
on:
  push:
    branches: [main, develop, 'feature/**', 'fix/**', 'release/**', 'hotfix/**']
  pull_request:
    branches: [main, develop]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-and-test:
    # Standard Intel capacity avoids the hosted arm64 queue failures. Tests run
    # natively; the distributable is still cross-built and verified as arm64.
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode toolchain
        run: echo "DEVELOPER_DIR=$(xcode-select -p)" >> "$GITHUB_ENV"
      - name: Check VI/EN localization
        run: python3 script/check_localization.py
      - name: Test policy and failure recovery with fake hardware
        run: ./script/test.sh
      - name: Build Apple Silicon app bundle
        env:
          MFC_BUILD_ARCH: arm64
        run: ./script/build_and_run.sh --build-only
      - name: Verify ad-hoc app signature
        run: codesign --verify --deep --strict dist/MyFanControl.app
      - name: Package and verify Apple Silicon preview
        env:
          MFC_BUILD_ARCH: arm64
        run: ./script/package_preview.sh
